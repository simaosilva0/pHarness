[project]
name = "pharness"
version = "0.1.0"
description = "Wiring harness concepts in YAML, checked"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.scripts]
pharness = "pharness.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"pharness.output" = ["ui/*"]
