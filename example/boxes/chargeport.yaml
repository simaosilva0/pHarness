box: ChargePort
note: the charging inlet on the side pod; the charger's plug closes the HVIL inside it

connectors:
  car:
    part: HVA280 2 pole
    cable: Charge
    pins:
      - {pin: '+', net: charge, type: hv:p, to: Battery, at: pass}
      - {pin: '-', net: charge, type: hv:n, to: Battery, at: pass}
      - {pin: '1', net: hvil, type: chain:2, to: Battery}
      - {pin: '2', net: hvil, type: chain:3, to: Battery}
      - {pin: '3', net: can_charge, type: can:h, to: Battery, at: pass}
      - {pin: '4', net: can_charge, type: can:l, to: Battery, at: pass}
  inlet:
    part: Type 2 inlet
    cable: Charger Lead
    pins:
      - {pin: L1, net: charge, type: hv:p, to: Charger, at: pass}
      - {pin: N, net: charge, type: hv:n, to: Charger, at: pass}
      - {pin: CAN H, net: can_charge, type: can:h, to: Charger, at: pass}
      - {pin: CAN L, net: can_charge, type: can:l, to: Charger, at: pass}
